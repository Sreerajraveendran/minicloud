name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that publish ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are referenced by version tag. Dependabot (see dependabot.yml) keeps
# them current; pin to commit SHAs once the pipeline is stable.
jobs:
  python:
    name: ${{ matrix.service }} · lint and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, mgmt-api]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  manifests:
    name: Kubernetes manifests · render and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize
        run: |
          cp deploy/k8s/base/secrets.env.example deploy/k8s/base/secrets.env
          kubectl kustomize deploy/k8s/base > rendered.yaml
          kubectl kustomize deploy/k8s/metrics-server > metrics-server.yaml
      - name: Validate against the Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.33.0 /w/rendered.yaml /w/metrics-server.yaml

  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Compose · validate and smoke test
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: deploy/compose
        run: docker compose --env-file .env.example config --quiet
      - name: Start the stack
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Smoke test through NGINX
        run: |
          B=http://127.0.0.1:8088
          curl -fsS $B/health/ready
          # Writes need the token from .env.example; the trace must show the cache step.
          id=$(curl -fsS -X POST -H 'Authorization: Bearer demo-token' -H 'Content-Type: application/json' \
            -d '{"name":"ci"}' $B/api/v1/items | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          curl -fsS -H 'X-Trace: 1' $B/api/v1/items/$id \
            | python3 -c 'import sys,json; s=[x["status"] for x in json.load(sys.stdin)["trace"]["steps"] if x["name"]=="Cache lookup"]; assert s==["hit"], s'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"name":"x"}' $B/api/v1/items)" = 401
          # Every instance must answer at least once.
          seen=$(for i in $(seq 30); do curl -fsS $B/api/v1/info | python3 -c 'import sys,json; print(json.load(sys.stdin)["instance"])'; done | sort -u | wc -l)
          echo "distinct instances: $seen"
          test "$seen" -eq 3
      - name: Failure drill — one instance stopped, no failed requests
        working-directory: deploy/compose
        run: |
          docker compose stop app-2
          for i in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8088/api/v1/info; done
      - name: Logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  images:
    name: Images · build, scan, push
    runs-on: ubuntu-latest
    needs: [python, web]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [app, web, mgmt-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (cached)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
